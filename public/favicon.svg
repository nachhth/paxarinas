<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Paxariñas">
  <title>Paxariñas</title>
  <!-- Paporrubio (Erithacus rubecula). Debuxado a partir dunha fotografía.
       Escolleuse por ser o paxaro que calquera de aquí recoñece, e porque o
       papo laranxa dálle á marca un acento que a paleta do monte non tiña.

       Tres cousas que non conviña facer doutro xeito:

       · A silueta é UNHA curva continua: cabeza, corpo e rabo saen do mesmo
         trazo, cunha cintura no ventre por onde arranca o rabo. Montado como
         elipse máis cuña, o resultado era unha pa de ping-pong.
       · O pardo é a BASE e o ventre claro vai enriba, non ao revés. Pintando o
         pardo por riba dunha base clara, o rabo saía partido en dous ao longo.
       · Todo o recheo vai recortado contra a silueta (`clipPath`), así que os
         bordos casan sempre por moito que se movan as manchas de cor.

       Comprobouse renderizado a 16, 24, 32, 48, 64 e 320 px, en claro e en
       escuro: a 16 px o que ten que quedar é o papo laranxa e o rabo. -->
  <defs>
    <clipPath id="ave">
      <path d="M27 13.5c7-.5 14 5.5 16.5 13.5 1.3 4.5 1 7 .5 9.5l12.5 8.5c1.5 1 1 2.5-1 2.5l-15-4.5c-2.5 4.5-7.5 6.5-13 6.5-8.5 0-15-6.5-15.5-14.5-.5-7 1-12 4.5-15.5 3-4 6.5-6 11-6z"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#2d5016"/>
  <g>
    <path fill="#8a7452" d="M27 13.5c7-.5 14 5.5 16.5 13.5 1.3 4.5 1 7 .5 9.5l12.5 8.5c1.5 1 1 2.5-1 2.5l-15-4.5c-2.5 4.5-7.5 6.5-13 6.5-8.5 0-15-6.5-15.5-14.5-.5-7 1-12 4.5-15.5 3-4 6.5-6 11-6z"/>
    <g clip-path="url(#ave)">
      <path fill="#efe9dc" d="M17 44c4 10 16 10 27 2-2-5-8-12.5-15-13-6 0-11.5 4-12 11z"/>
      <path fill="#d9622b" d="M24 13c5 6 6.5 12 5.5 18-1 8-4.5 14-10 18.5L0 62V0z"/>
      <path fill="none" stroke="#c8cec6" stroke-width="1.1" stroke-linecap="round"
            d="M24 13c5 6 6.5 12 5.5 18-1 8-4.5 14-10 18.5"/>
    </g>
    <path fill="#26301c" d="M15.5 21.4 6.2 24.6 15.4 27.4z"/>
    <circle cx="21.4" cy="22.6" r="1.85" fill="#12160f"/>
  </g>
</svg>
